name: Update Chance Liga rosters and values

on:
  schedule:
    # Friday morning in Prague all year: 09:15 CEST / 08:15 CET.
    # :15 avoids the busiest top-of-hour GitHub Actions window.
    - cron: "15 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chance-liga-rosters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: python -m pip install --disable-pip-version-check lxml==5.4.0

      - name: Audit official rosters and Transfermarkt values
        run: >-
          python scripts/update_rosters.py
          --output rosters-live.json
          --audit-output roster-audit-live.json
          --index index.html
          --workers 8

      - name: Validate changed-file scope
        shell: bash
        run: |
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(rosters-live\.json|roster-audit-live\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified update
        shell: bash
        run: |
          if git diff --quiet -- rosters-live.json roster-audit-live.json; then
            echo "No roster or market-value data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosters-live.json roster-audit-live.json
          git commit -m "Update Chance Liga rosters and values"
          git push
