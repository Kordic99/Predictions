name: Update Chance Liga schedule

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"
      timezone: "Europe/Prague"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chance-liga-schedule
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read official schedule
        run: python scripts/update_schedule.py
      - name: Commit a changed schedule
        shell: bash
        run: |
          if git diff --quiet -- schedule-live.json; then
            echo "No published schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-live.json
          git commit -m "Update official Chance Liga schedule"
          git push
