name: Update Livesport player rosters, match ratings and season totals

on:
  workflow_dispatch:
  schedule:
    # Hourly, offset from the schedule and match-context workflows.
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-livesport-player-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check lxml==5.4.0
      - name: Run player-stat parser regression tests
        run: python -m unittest discover -s tests -p "test_update_livesport_match_stats.py"
      - name: Refresh rosters, completed-match ratings and season totals
        run: >-
          python scripts/update_livesport_rosters.py
          --output rosters-live.json
          --audit-output roster-audit-live.json
          --schedule schedule-live.json
      - name: Validate generated JSON
        run: |
          python -m json.tool rosters-live.json > /dev/null
          python -m json.tool roster-audit-live.json > /dev/null
      - name: Validate changed-file scope
        shell: bash
        run: |
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(rosters-live\.json|roster-audit-live\.json)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit verified update
        shell: bash
        run: |
          if git diff --quiet -- rosters-live.json roster-audit-live.json; then
            echo "Livesport player data has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rosters-live.json roster-audit-live.json
          git commit -m "Update Livesport player ratings and season totals"
          git push
